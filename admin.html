<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="https://wellspringcf.org/favicon.ico">
  <title>Workshop Registrations - Admin Dashboard</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-disabled: #93c5fd;
      --secondary: #475569;
      --secondary-hover: #334155;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --border: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 2rem 1.25rem;
      display: flex;
      justify-content: center;
    }

    .dashboard {
      width: 100%;
      max-width: 800px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text);
    }

    .header-actions {
      display: flex;
      gap: 0.6rem;
    }

    .btn {
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .refresh-btn {
      background-color: var(--primary);
      color: white;
    }

    .refresh-btn:hover {
      background-color: var(--primary-hover);
    }

    .print-btn {
      background-color: var(--secondary);
      color: white;
    }

    .print-btn:hover {
      background-color: var(--secondary-hover);
    }

    /* Metric Cards Grid */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .metric-card {
      background: var(--card-bg);
      padding: 1.5rem;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .metric-title {
      font-size: 0.875rem;
      font-weight: 600;
      color: #64748b;
      margin-bottom: 0.5rem;
    }

    /* Larger font size for 1st and 3rd cards */
    .metric-value {
      font-size: 2.25rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.2;
    }

    /* Gauge Styles (Height reduced to 80%) */
    .gauge-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: -0.25rem;
    }

    .gauge-svg {
      width: 130px;
      height: 68px; /* 80% of previous height */
      overflow: visible;
    }

    .gauge-needle {
      transform-origin: 100px 90px;
      transform: rotate(-90deg);
      transition: transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .gauge-text {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text);
      margin-top: -2px;
    }

    /* Registrants Table Section */
    .table-container {
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .table-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      font-size: 1.1rem;
      font-weight: 700;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 1rem 1.5rem;
      font-size: 0.95rem;
    }

    th {
      background-color: #f1f5f9;
      font-weight: 600;
      color: #475569;
      border-bottom: 1px solid var(--border);
    }

    tr:not(:last-child) td {
      border-bottom: 1px solid #f1f5f9;
    }

    .empty-state {
      text-align: center;
      padding: 3rem;
      color: #64748b;
    }

    /* Pagination Bar Controls */
    .pagination-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.5rem;
      background-color: var(--card-bg);
      border-top: 1px solid var(--border);
    }

    .pagination-btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 0.4rem 0.9rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .pagination-btn:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    .pagination-btn:disabled {
      background-color: var(--primary-disabled);
      cursor: not-allowed;
    }

    .page-info {
      font-size: 0.875rem;
      color: #64748b;
      font-weight: 500;
    }

    /* Printable Attendance Sheet (Hidden on screen) */
    .printable-attendance {
      display: none;
    }

    @media print {
      @page {
        size: letter portrait;
        margin: 0.45in;
      }

      html, body {
        background: #ffffff;
        color: #000000;
        padding: 0;
        margin: 0;
        height: 100%;
        display: block;
      }

      .dashboard {
        display: none;
      }

      .printable-attendance {
        display: flex;
        flex-direction: column;
        width: 100%;
        min-height: 20.1in; /* Spans two Letter pages (~10.05in each inside 0.45in margins) */
      }

      .print-header {
        margin-bottom: 0.75rem;
        border-bottom: 2px solid #0f172a;
        padding-bottom: 0.5rem;
        flex-shrink: 0;
      }

      .print-header h1 {
        font-size: 1.35rem;
        margin-bottom: 0.2rem;
      }

      .print-meta {
        font-size: 0.85rem;
        color: #475569;
      }

      .attendance-table {
        width: 100%;
        flex: 1 1 auto;
        border-collapse: collapse;
        table-layout: fixed;
      }

      .attendance-table thead {
        display: table-header-group;
      }

      .attendance-table th,
      .attendance-table td {
        border: 1px solid #334155;
        padding: 0.42rem 0.65rem;
        font-size: 0.92rem;
        line-height: 1.25;
        word-break: break-word;
      }

      .attendance-table th {
        background-color: #f1f5f9 !important;
        color: #0f172a !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .check-col {
        width: 84px;
        text-align: center;
        white-space: nowrap;
      }

      .name-col {
        width: 46%;
      }

      .email-col {
        width: 44%;
      }

      .checkbox-square {
        display: inline-block;
        width: 16px;
        height: 16px;
        border: 2px solid #0f172a;
        border-radius: 3px;
        vertical-align: middle;
      }
    }
  </style>
</head>
<body>

  <div class="dashboard">
    <header>
      <h1>Workshop Registrations</h1>
      <div class="header-actions">
        <button class="btn print-btn" onclick="openAttendancePrintView()">Print Attendance</button>
        <button class="btn refresh-btn" onclick="loadDashboardData()">Refresh</button>
      </div>
    </header>

    <!-- 3 Summary Cards -->
    <div class="metrics-grid">
      <div class="metric-card">
        <div class="metric-title">Total Registrations</div>
        <div id="totalRegistrations" class="metric-value">-</div>
      </div>

      <!-- Gauge Card -->
      <div class="metric-card">
        <div class="metric-title">Percentage Filled</div>
        <div class="gauge-container">
          <svg class="gauge-svg" viewBox="0 0 200 100">
            <!-- Red Region: 0% to 30% (180° to 126°) -->
            <path d="M 20 90 A 80 80 0 0 1 52.98 25.28" fill="none" stroke="#ef4444" stroke-width="18" />
            <!-- Orange Region: 30% to 75% (126° to 45°) -->
            <path d="M 52.98 25.28 A 80 80 0 0 1 156.57 33.43" fill="none" stroke="#f97316" stroke-width="18" />
            <!-- Green Region: 75% to 100% (45° to 0°) -->
            <path d="M 156.57 33.43 A 80 80 0 0 1 180 90" fill="none" stroke="#22c55e" stroke-width="18" />
            
            <!-- Needle -->
            <g id="gaugeNeedle" class="gauge-needle">
              <polygon points="96,90 104,90 100,20" fill="#0f172a" />
              <circle cx="100" cy="90" r="7" fill="#0f172a" />
              <circle cx="100" cy="90" r="3" fill="#ffffff" />
            </g>
          </svg>
          <div id="percentageFilled" class="gauge-text">-</div>
        </div>
      </div>

      <div class="metric-card">
        <div class="metric-title">Remaining Spots</div>
        <div id="remainingSeats" class="metric-value">-</div>
      </div>
    </div>

    <!-- Registrants Table -->
    <div class="table-container">
      <div class="table-header">Registered Attendees</div>
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Full Name</th>
            <th>Date Registered</th>
          </tr>
        </thead>
        <tbody id="registrantsTableBody">
          <tr>
            <td colspan="3" class="empty-state">Loading participants...</td>
          </tr>
        </tbody>
      </table>

      <!-- Blue Pagination Controls -->
      <div class="pagination-controls" id="paginationControls">
        <button class="pagination-btn" id="prevBtn" onclick="changePage(-1)" disabled>Previous</button>
        <span class="page-info" id="pageInfo">Page 1 of 1</span>
        <button class="pagination-btn" id="nextBtn" onclick="changePage(1)" disabled>Next</button>
      </div>
    </div>
  </div>

  <!-- Printable Physical Attendance Sheet -->
  <section class="printable-attendance" id="printableAttendance" aria-label="Printable Attendance Sheet">
    <div class="print-header">
      <h1>Workshop Physical Attendance Sheet</h1>
      <div class="print-meta" id="printMeta">Sorted Alphabetically by Full Name</div>
    </div>
    <table class="attendance-table">
      <thead>
        <tr>
          <th class="check-col">Present</th>
          <th class="name-col">Full Name</th>
          <th class="email-col">Email</th>
        </tr>
      </thead>
      <tbody id="attendanceTableBody">
        <tr>
          <td colspan="3" class="empty-state">No participants available.</td>
        </tr>
      </tbody>
    </table>
  </section>

  <script>
    // Configuration
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxhC7wW1xN_p6GhB4j5FOFUll6d7zitozdE6s2Mj4-9gaSJBv2vU2AcPE6wJfrc8pUh/exec';
    const MAX_CAPACITY = 25; // Keep matching your registration form capacity
    const ITEMS_PER_PAGE = 5;
    const MIN_TWO_PAGE_ROWS = 50; // Enough rows to span and fill down to the bottom of page 2

    // Pagination State Variables
    let allRegistrants = [];
    let currentPage = 1;

    async function loadDashboardData() {
      const totalEl = document.getElementById('totalRegistrations');
      const percentEl = document.getElementById('percentageFilled');
      const needleEl = document.getElementById('gaugeNeedle');
      const remainingEl = document.getElementById('remainingSeats');
      const tableBody = document.getElementById('registrantsTableBody');

      try {
        const response = await fetch(SCRIPT_URL);
        const data = await response.json();
        
        const count = data.count || 0;
        allRegistrants = data.registrants || [];

        // 1. Calculate metrics
        const percentage = Math.min(100, Math.max(0, Math.round((count / MAX_CAPACITY) * 100)));
        const remaining = Math.max(0, MAX_CAPACITY - count);

        totalEl.innerText = `${count} / ${MAX_CAPACITY}`;
        percentEl.innerText = `${percentage}%`;
        remainingEl.innerText = remaining;

        // 2. Rotate Gauge Needle (-90deg = 0%, 0deg = 50%, +90deg = 100%)
        const rotationDegrees = -90 + (percentage / 100) * 180;
        needleEl.style.transform = `rotate(${rotationDegrees}deg)`;

        // Reset to initial page and render
        currentPage = 1;
        renderTablePage();
        renderAttendanceSheet();

      } catch (err) {
        totalEl.innerText = 'Error';
        percentEl.innerText = 'Error';
        remainingEl.innerText = 'Error';
        needleEl.style.transform = 'rotate(-90deg)';
        tableBody.innerHTML = `<tr><td colspan="3" class="empty-state" style="color: #dc2626;">Failed to load data. Please try refreshing.</td></tr>`;
        document.getElementById('attendanceTableBody').innerHTML = `<tr><td colspan="3" class="empty-state">Unable to load registrants for attendance sheet.</td></tr>`;
        document.getElementById('pageInfo').innerText = 'Page 0 of 0';
        document.getElementById('prevBtn').disabled = true;
        document.getElementById('nextBtn').disabled = true;
      }
    }

    function renderTablePage() {
      const tableBody = document.getElementById('registrantsTableBody');
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      const pageInfo = document.getElementById('pageInfo');

      if (allRegistrants.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="3" class="empty-state">No registrations yet.</td></tr>`;
        pageInfo.innerText = `Page 1 of 1`;
        prevBtn.disabled = true;
        nextBtn.disabled = true;
        return;
      }

      const totalPages = Math.ceil(allRegistrants.length / ITEMS_PER_PAGE);
      if (currentPage > totalPages) currentPage = totalPages;
      if (currentPage < 1) currentPage = 1;

      const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
      const pageItems = allRegistrants.slice(startIndex, startIndex + ITEMS_PER_PAGE);

      let rowsHtml = '';
      pageItems.forEach((reg, index) => {
        const globalIndex = startIndex + index + 1;
        const dateObj = new Date(reg.timestamp);
        const formattedDate = isNaN(dateObj) ? reg.timestamp : dateObj.toLocaleString('en-US', {
          month: 'short',
          day: 'numeric',
          year: 'numeric'
        });

        rowsHtml += `
          <tr>
            <td>${globalIndex}</td>
            <td><strong>${escapeHtml(reg.fullName)}</strong></td>
            <td>${formattedDate}</td>
          </tr>
        `;
      });

      tableBody.innerHTML = rowsHtml;

      // Update Pagination UI
      pageInfo.innerText = `Page ${currentPage} of ${totalPages}`;
      prevBtn.disabled = currentPage === 1;
      nextBtn.disabled = currentPage === totalPages;
    }

    function extractRegistrantEmail(reg) {
      if (!reg) return '';
      if (typeof reg === 'string') {
        const match = reg.match(/[^\s@]+@[^\s@]+\.[^\s@]+/);
        return match ? match[0].trim() : '';
      }
      if (typeof reg !== 'object') return '';

      const priorityKeys = [
        'email',
        'Email',
        'emailAddress',
        'email_address',
        'Email Address',
        'contactEmail',
        'userEmail'
      ];
      for (const key of priorityKeys) {
        if (typeof reg[key] === 'string' && reg[key].trim()) {
          return reg[key].trim();
        }
      }

      // Check any key mentioning "email" or "mail"
      for (const [key, val] of Object.entries(reg)) {
        if (/email|mail/i.test(key) && typeof val === 'string' && val.trim()) {
          return val.trim();
        }
      }

      // Deep scan any string/nested fields for an email address
      for (const val of Object.values(reg)) {
        if (typeof val === 'string') {
          const match = val.match(/[^\s@]+@[^\s@]+\.[^\s@]+/);
          if (match) return match[0].trim();
        } else if (val && typeof val === 'object') {
          const nested = extractRegistrantEmail(val);
          if (nested) return nested;
        }
      }

      return '';
    }

    function maskEmail(email) {
      if (!email || typeof email !== 'string') return '';
      const trimmed = email.trim();
      const atIndex = trimmed.indexOf('@');
      if (atIndex <= 0) {
        return '*'.repeat(Math.max(3, trimmed.length));
      }

      const localPart = trimmed.slice(0, atIndex);
      const domainPart = trimmed.slice(atIndex + 1);
      const dotIndex = domainPart.lastIndexOf('.');

      const visibleLocal = localPart.slice(0, 1);
      const maskedLocal = '*'.repeat(Math.max(3, localPart.length - 1));

      if (dotIndex > 0) {
        const domainName = domainPart.slice(0, dotIndex);
        const tld = domainPart.slice(dotIndex);
        const maskedDomain = '*'.repeat(Math.max(2, domainName.length));
        return `${visibleLocal}${maskedLocal}@${maskedDomain}${tld}`;
      }

      return `${visibleLocal}${maskedLocal}@${'*'.repeat(Math.max(3, domainPart.length))}`;
    }

    function renderAttendanceSheet() {
      const attendanceBody = document.getElementById('attendanceTableBody');
      const printMeta = document.getElementById('printMeta');

      const sortedRegistrants = [...(allRegistrants || [])].sort((a, b) =>
        String(a.fullName || '').localeCompare(String(b.fullName || ''), undefined, { sensitivity: 'base' })
      );

      const emptyRowsNeeded = Math.max(6, MIN_TWO_PAGE_ROWS - sortedRegistrants.length);

      const printedDate = new Date().toLocaleDateString('en-US', {
        month: 'short',
        day: 'numeric',
        year: 'numeric'
      });
      printMeta.innerText = `Registered: ${sortedRegistrants.length} (+${emptyRowsNeeded} open lines) • Sorted Alphabetically • Printed ${printedDate}`;

      const registrantRowsHtml = sortedRegistrants.map((reg) => {
        const rawEmail = extractRegistrantEmail(reg);
        return `
          <tr>
            <td class="check-col"><span class="checkbox-square" aria-hidden="true"></span></td>
            <td class="name-col">${escapeHtml(reg.fullName)}</td>
            <td class="email-col">${escapeHtml(maskEmail(rawEmail))}</td>
          </tr>
        `;
      }).join('');

      const blankRowsHtml = Array.from({ length: emptyRowsNeeded }, () => `
        <tr>
          <td class="check-col"><span class="checkbox-square" aria-hidden="true"></span></td>
          <td class="name-col"></td>
          <td class="email-col"></td>
        </tr>
      `).join('');

      attendanceBody.innerHTML = registrantRowsHtml + blankRowsHtml;
    }

    function openAttendancePrintView() {
      renderAttendanceSheet();
      window.print();
    }

    function changePage(direction) {
      currentPage += direction;
      renderTablePage();
    }

    // Helper to prevent injection
    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // Load on page startup
    loadDashboardData();
  </script>

</body>
</html>
